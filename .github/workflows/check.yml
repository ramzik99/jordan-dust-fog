name: Check plugin
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: jordan-dust-fog-plugin
          path: dist/

  preview:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview-site
      - uses: actions/download-artifact@v4
        with:
          name: jordan-dust-fog-plugin
          path: built-plugin
      - name: Update development preview branch
        shell: bash
        run: |
          if git -C preview-site fetch origin preview:refs/remotes/origin/preview --depth=1; then
            git -C preview-site switch -C preview origin/preview
          else
            git -C preview-site switch --orphan preview
          fi
          cp built-plugin/plugin.js built-plugin/plugin.min.js built-plugin/plugin.json built-plugin/package.json preview-site/
          if [ -f built-plugin/plugin.js.map ]; then cp built-plugin/plugin.js.map preview-site/; fi
          git -C preview-site config user.name 'github-actions[bot]'
          git -C preview-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C preview-site add plugin.js plugin.min.js plugin.json package.json
          if [ -f preview-site/plugin.js.map ]; then git -C preview-site add plugin.js.map; fi
          if git -C preview-site diff --cached --quiet; then exit 0; fi
          git -C preview-site commit -m "Update development preview from ${GITHUB_SHA}"
          git -C preview-site push origin HEAD:preview
      - name: Verify browser-loadable preview
        shell: bash
        run: |
          PREVIEW_COMMIT=$(git -C preview-site rev-parse HEAD)
          export PREVIEW_URL="https://cdn.jsdelivr.net/gh/ramzik99/jordan-dust-fog@${PREVIEW_COMMIT}/plugin.js"
          python -u - <<'PY'
          import os, urllib.request
          url = os.environ['PREVIEW_URL']
          print('Windy developer-mode URL: ' + url)
          with urllib.request.urlopen(url, timeout=45) as response:
              mime = response.headers.get('Content-Type', '')
              cors = response.headers.get('Access-Control-Allow-Origin', '')
              body = response.read()
          if 'javascript' not in mime or cors != '*' or len(body) < 1000:
              raise RuntimeError(f'Unexpected CDN response: {mime}, CORS={cors}, size={len(body)}')
          print(f'JavaScript and browser CORS verified; {len(body)} bytes')
          PY
