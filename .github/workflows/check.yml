name: Check plugin
on:
  push:
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: jordan-dust-fog-plugin
          path: dist/
