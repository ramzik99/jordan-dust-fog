name: Refresh synoptic contours
on:
  push:
    branches: [main]
    paths: ['scripts/ingest_synoptic.py', 'scripts/ingest_gfs.py', 'requirements.txt', '.github/workflows/synoptic.yml']
  workflow_dispatch:
  schedule:
    - cron: '45 4,10,16,22 * * *'
permissions:
  contents: write
concurrency:
  group: synoptic-data
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore previous generated contour data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          SYNOPTIC_HEAD=$(git -C publisher ls-remote --heads origin refs/heads/synoptic-data | awk '{print $1}')
          echo "SYNOPTIC_HEAD=$SYNOPTIC_HEAD" >> "$GITHUB_ENV"
          if [ -n "$SYNOPTIC_HEAD" ]; then
            git -C publisher fetch --depth=1 origin refs/heads/synoptic-data
            test "$(git -C publisher rev-parse FETCH_HEAD)" = "$SYNOPTIC_HEAD"
            git -C publisher archive FETCH_HEAD | tar -x -C generated
          fi
      - run: python -u scripts/ingest_gfs.py --output generated/contours
      - name: Publish generated contour data
        shell: bash
        run: |
          set -euo pipefail
          git -C publisher switch --orphan next-synoptic-data
          cp -R generated/contours publisher/contours
          git -C publisher config user.name 'github-actions[bot]'
          git -C publisher config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publisher add contours
          git -C publisher commit -m "Validated global contour fields through hour 384"
          git -C publisher push --force-with-lease="refs/heads/synoptic-data:${SYNOPTIC_HEAD}" origin HEAD:refs/heads/synoptic-data
