name: Check native dust and satellite access
on:
  push:
    paths: ['.github/workflows/source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check source responses
        run: |
          python -u - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          urls = {
              'NASA_NATIVE': 'https://opendap.nccs.nasa.gov/dods/GEOS-5/fp/0.25_deg/fcast/tavg3_2d_aer_Nx.latest.ascii?dusmass%5B0:1:0%5D%5B488:1:488%5D%5B690:1:690%5D',
              'SAT_GLOBAL': 'https://view.eumetsat.int/geoserver/mumi/wms?service=WMS&request=GetCapabilities',
              'SAT_MTG': 'https://view.eumetsat.int/geoserver/mtg_fd/wms?service=WMS&request=GetCapabilities',
          }
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'Origin':'https://www.windy.com'})
                  with urllib.request.urlopen(req, timeout=40) as response:
                      body = response.read(12000000)
                      print(name, response.status, response.headers.get('Content-Type'), 'CORS', response.headers.get('Access-Control-Allow-Origin'), 'BYTES', len(body))
                  if name == 'NASA_NATIVE':
                      print(body.decode('utf-8')[:1500])
                  else:
                      root = ET.fromstring(body)
                      for layer in root.findall('.//{*}Layer'):
                          node = layer.find('{*}Name')
                          if node is not None and 'dust' in (node.text or '').lower():
                              dims = [(d.attrib, (d.text or '')[-500:]) for d in layer.findall('{*}Dimension')]
                              print('DUST_LAYER', node.text, 'DIMENSIONS', dims)
              except Exception as exc:
                  print(name, 'ERROR', str(exc))
          PY
