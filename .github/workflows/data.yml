name: Refresh GEOS dust forecast
on:
  push:
    branches: [main]
    paths: ['scripts/native_dust.py', 'scripts/ingest_geos.py', 'scripts/verify-native.py', 'requirements.txt', '.daprc', '.github/workflows/data.yml']
  workflow_dispatch:
  schedule:
    - cron: '25 4,10,16,22 * * *'
permissions:
  contents: write
concurrency:
  group: geos-data
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Restore previous generated data only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          DUST_DATA_HEAD=$(git -C publisher ls-remote --heads origin refs/heads/geos-dust-data | awk '{print $1}')
          echo "DUST_DATA_HEAD=$DUST_DATA_HEAD" >> "$GITHUB_ENV"
          if [ -n "$DUST_DATA_HEAD" ]; then
            git -C publisher fetch --depth=1 origin refs/heads/geos-dust-data
            test "$(git -C publisher rev-parse FETCH_HEAD)" = "$DUST_DATA_HEAD"
            git -C publisher archive FETCH_HEAD | tar -x -C generated
          fi
      - name: Download and encode native GEOS-FP dust
        run: python -u scripts/native_dust.py --output generated/global/latest.json
      - name: Validate overview and native delivery files
        run: |
          node scripts/validate-global.mjs generated/global/latest.json
          python scripts/verify-native.py generated/global/latest.json
      - name: Publish generated data without source-history growth
        shell: bash
        run: |
          set -euo pipefail
          git -C publisher switch --orphan next-geos-dust-data
          cp -R generated/global publisher/global
          git -C publisher config user.name 'github-actions[bot]'
          git -C publisher config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publisher add global
          git -C publisher commit -m "Validated native GEOS-FP dust data"
          git -C publisher push --force-with-lease="refs/heads/geos-dust-data:${DUST_DATA_HEAD}" origin HEAD:refs/heads/geos-dust-data
