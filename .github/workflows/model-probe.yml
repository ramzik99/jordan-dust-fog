name: Inspect Windy model interfaces
on:
  push:
    branches: [inspect-windy-model]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS https://www.windy.com/v/51.3.2.ind.81aa/index.js -o /tmp/windy.js
          python - <<'PY'
          s=open('/tmp/windy.js').read()
          for key in ['function Jv(', 'Jv=', 'function qv(', 'qv=', 'function Rv(', 'function nv(']:
              i=s.find(key)
              if i>=0:print('SOURCE',key,s[i:i+4000])
          PY
